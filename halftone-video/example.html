<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halftone video example</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    .split { display: flex; min-height: 100vh; }
    .text { flex: 1; padding: 48px; display: flex; flex-direction: column; justify-content: center; }
    .art { width: 35%; border-left: 1px solid rgba(0,0,0,.1); }
    @media (max-width: 760px) {
      .split { flex-direction: column; }
      .art { width: 100%; height: 70vh; border-left: 0; }
    }
  </style>
</head>
<body>
  <div class="split">
    <div class="text">
      <h1>Your name</h1>
      <p>Put your clip next to this file as clip.mp4, then open this page through a local server
         (for example, run <code>npx serve</code> in this folder). Opening the file directly by
         double-clicking it will not work, because browsers block reading video pixels from local files.</p>
    </div>

    <!-- The effect fills this box. Change the settings with the data- attributes. -->
    <div class="art"
         data-halftone-video="clip.mp4"
         data-cols="140"
         data-threshold="0.22"
         data-shape="diamond"></div>
  </div>

  <script src="halftone-video.js"></script>
</body>
</html>
